name: Package & Release

on:
  push:
    tags:
      - '*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Package module
        run: |
          echo "Packaging quoteautofollowups module ..."
          mkdir artifacts
          cp LICENSE.md quoteautofollowups/LICENSE.md
          cp README.md quoteautofollowups/README.md
          cp CHANGELOG.md quoteautofollowups/ChangeLog.md
          zip -r "artifacts/module_quoteautofollowups-${{ github.ref_name }}.zip" quoteautofollowups/
          echo "quoteautofollowups module packaged."

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          body: Release created from CI/CD
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: artifacts/module_quoteautofollowups-${{ github.ref_name }}.zip
